<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>KVKZ Market Debug</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        :root { --tg-hint: #8e8e93; --tg-link: #007aff; --bg: #f4f4f7; --active-green: #34c759; --active-red: #ff3b30; }
        * { box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding-bottom: 80px; }
        
        /* Логгер ошибок на экран */
        #debug-console {
            background: #1c1c1e; color: #34c759; font-family: monospace; font-size: 11px;
            padding: 8px; margin: 8px; border-radius: 8px; word-break: break-all; max-height: 100px; overflow-y: auto;
        }

        .header { background: #fff; padding: 14px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; border-bottom: 0.5px solid #d1d1d6; }
        .card { background: #fff; margin: 10px; border-radius: 12px; padding: 14px; border: 0.5px solid #e5e5ea; }
        
        .blur-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.45); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
            z-index: 999; display: flex; align-items: center; justify-content: center; padding: 16px;
        }
        .modal-sheet { background: #fff; border-radius: 20px; padding: 20px; width: 100%; max-width: 340px; position: relative; }
        .close-cross { position: absolute; top: 14px; right: 14px; width: 28px; height: 28px; background: #f4f4f7; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; }
        .step-card { display: flex; align-items: center; justify-content: space-between; background: #f8f8fa; border: 1px solid #e5e5ea; padding: 12px; border-radius: 12px; margin-top: 10px; }
        .status-pill { font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 6px; }
        .pill-ok { background: #e8f5e9; color: #2e7d32; }
        .pill-need { background: #ffebee; color: #c62828; }
        .btn-action { width: 100%; padding: 12px; border-radius: 10px; font-weight: 700; border: none; color: #fff; background: var(--active-green); margin-top: 15px; cursor: pointer; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="debug-console">Логи приложения...</div>

    <div class="header">
        <span>KVKZ Market</span>
        <div id="ton-connect-btn"></div>
    </div>

    <div id="market-list">
        <div class="card">
            <div><b>Тестовый ордер USDT</b></div>
            <button class="btn-action" onclick="handleDealClick()">Купить USDT</button>
        </div>
    </div>

    <!-- Модалка с блюром -->
    <div id="auth-blur-modal" class="blur-overlay hidden" onclick="if(event.target.id==='auth-blur-modal') closeAuthModal()">
        <div class="modal-sheet">
            <div class="close-cross" onclick="closeAuthModal()">✕</div>
            <div style="text-align: center; margin-bottom: 12px;">
                <div style="font-size: 32px;">🛡️</div>
                <div style="font-weight: 800;">Проверка доступа</div>
            </div>
            <div class="step-card">
                <div><b>1. TON Кошелек</b></div>
                <div id="st-wallet" class="status-pill pill-need">Не привязан</div>
            </div>
            <div class="step-card">
                <div><b>2. Телефон</b></div>
                <div id="st-phone" class="status-pill pill-need">Не привязан</div>
            </div>
            <button id="modal-btn" class="btn-action" onclick="runNextStep()">Действие</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        // ⚠️ ВАЖНО: Убедись, что этот адрес совпадает с твоим актуальным туннелем (localtunnel/ngrok)!
        const API = "https://six-ghosts-shop.loca.lt"; 
        const user = tg.initDataUnsafe?.user || {id: 7032066503, first_name: "Developer"};

        function log(msg) {
            const c = document.getElementById('debug-console');
            c.innerHTML = `[${new Date().toLocaleTimeString()}] ${msg}<br>` + c.innerHTML;
        }

        log(`Юзер: ${user.id} (${user.first_name})`);

        let userStatus = { is_verified: false, has_wallet: false, has_phone: false };

        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://zakariislam580-star.github.io/kvkz-p2p/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-btn'
        });

        // Отслеживание привязки кошелька
        tonConnectUI.onStatusChange(async (wallet) => {
            if (wallet) {
                const addr = wallet.account.address;
                log(`Кошелек в UI: ${addr.substring(0, 8)}...`);
                
                try {
                    const resp = await fetch(`${API}/api/user/connect-wallet`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ user_id: Number(user.id), ton_wallet: String(addr) })
                    });
                    const resData = await resp.json();
                    log(`Ответ сервера: ${JSON.stringify(resData)}`);
                    await checkUserStatus();
                } catch (err) {
                    log(`ОШИБКА отправки кошелька: ${err.message}`);
                }
            }
        });

        async function checkUserStatus() {
            try {
                log("Запрос статуса с бэкенда...");
                const res = await fetch(`${API}/api/user/status/${user.id}`);
                userStatus = await res.json();
                log(`Статус из БД: W=${userStatus.has_wallet}, P=${userStatus.has_phone}`);
                
                updateModalUI();
                return userStatus;
            } catch (err) {
                log(`ОШИБКА статуса: ${err.message}`);
            }
        }

        function updateModalUI() {
            const wPill = document.getElementById('st-wallet');
            const pPill = document.getElementById('st-phone');
            const btn = document.getElementById('modal-btn');

            wPill.innerText = userStatus.has_wallet ? "Подключен" : "Не привязан";
            wPill.className = `status-pill ${userStatus.has_wallet ? 'pill-ok' : 'pill-need'}`;

            pPill.innerText = userStatus.has_phone ? "Подтвержден" : "Не привязан";
            pPill.className = `status-pill ${userStatus.has_phone ? 'pill-ok' : 'pill-need'}`;

            if (!userStatus.has_wallet) {
                btn.innerText = "Подключить TON Кошелек";
            } else if (!userStatus.has_phone) {
                btn.innerText = "Подтвердить телефон в боте";
            } else {
                btn.innerText = "Все привязано!";
            }
        }

        async function handleDealClick() {
            log("Клик по ордеру...");
            await checkUserStatus();
            if (userStatus.is_verified) {
                alert("Успех! Переходим к сделке.");
            } else {
                openAuthModal();
            }
        }

        function openAuthModal() {
            updateModalUI();
            document.getElementById('auth-blur-modal').classList.remove('hidden');
        }

        function closeAuthModal() {
            document.getElementById('auth-blur-modal').classList.add('hidden');
        }

        function runNextStep() {
            if (!userStatus.has_wallet) {
                tonConnectUI.openModal();
            } else if (!userStatus.has_phone) {
                tg.sendData(JSON.stringify({ action: "request_phone" }));
                tg.close();
            }
        }

        tg.expand();
        checkUserStatus();
    </script>
</body>
</html>
